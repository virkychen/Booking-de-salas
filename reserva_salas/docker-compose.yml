services:
  reservation-service:
    build:
      context: ./reservation_service
    container_name: reservation-service
    ports:
      - "5000:5000"
    environment:
      - ROOM_SERVICE_URL=http://room-service:5001
      - SCHEDULE_SERVICE_URL=http://schedule-service:5002
      - REQUEST_TIMEOUT_SECONDS=2
      - MAX_RETRIES=3
      - RETRY_DELAY_SECONDS=0.5
    depends_on:
      - room-service
      - schedule-service

  room-service:
    build:
      context: ./room_service
    container_name: room-service
    ports:
      - "5001:5001"
    environment:
      - SCHEDULE_SERVICE_URL=http://schedule-service:5002

  schedule-service:
    build:
      context: ./schedule_service
    container_name: schedule-service
    ports:
      - "5002:5002"
    environment:
      - BOOKINGS_PATH=/data/bookings.json
      - EVENTS_PATH=/data/events.jsonl
      - PENDING_PATH=/data/pending.json
      - OPERATING_START_HOUR=9
      - OPERATING_END_HOUR=23
    volumes:
      - schedule_data:/data

volumes:
  schedule_data:
